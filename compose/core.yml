services:

  postgres:
    image: postgres:17
    container_name: workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - workbench

  redis:
    image: redis:8
    container_name: workbench-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    networks:
      - workbench

  qdrant:
    image: qdrant/qdrant:latest
    container_name: workbench-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ../data/qdrant:/qdrant/storage
    networks:
      - workbench

  minio:
    image: minio/minio:latest
    container_name: workbench-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: workbench
      MINIO_ROOT_PASSWORD: workbench123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../data/minio:/data
    networks:
      - workbench

  adminer:
    image: adminer
    container_name: workbench-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - workbench

  n8n:
    image: n8nio/n8n:latest
    container_name: workbench-n8n
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - ../data/n8n:/home/node/.n8n
    networks:
      - workbench

networks:
  workbench:
    name: workbench-network